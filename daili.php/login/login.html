<!DOCTYPE html>
<html lang="en">
  <meta http-equiv="content-type" content="text/html;charset=utf-8" />
  <head>
    <meta charset="UTF-8" />
    <title>代理登录-实名微信出售-购买VX稳定账号-自动发货平台</title>
    <meta name="renderer" content="webkit|ie-comp|ie-stand" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta
      name="viewport"
      content="width=device-width,user-scalable=yes, minimum-scale=0.4, initial-scale=0.8,target-densitydpi=low-dpi"
    />
    <meta http-equiv="Cache-Control" content="no-siteapp" />
    <link rel="stylesheet" href="../../public/static/css/font.css" />
    <link rel="stylesheet" href="../../public/static/css/xadmin.css" />
    <!-- 使用 CDN 引入 layui CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.staticfile.org/layui/2.8.11/css/layui.min.css"
    />
    <!-- 使用 CDN 引入 layui JavaScript -->
    <script src="https://cdn.staticfile.org/layui/2.8.11/layui.min.js"></script>
    <script
      type="text/javascript"
      src="../../public/static/js/xadmin.js"
    ></script>
  </head>
  <body class="login-bg">
    <div class="login">
      <div class="message">
        实名微信出售-购买VX稳定账号-自动发货平台-代理登录
      </div>
      <div id="darkbannerwrap"></div>
      <form method="post" class="layui-form" action="#">
        <input
          name="username"
          placeholder="用户名"
          type="text"
          lay-verify="required"
          class="layui-input"
        />
        <hr class="hr15" />
        <input
          name="password"
          lay-verify="required"
          placeholder="密码"
          type="password"
          class="layui-input"
        />
        <hr class="hr15" />
        <input
          value="登录"
          lay-submit
          lay-filter="login"
          style="width: 100%"
          type="submit"
        />
        <hr class="hr20" />
        <a
          class="layui-btn layui-btn-lg layui-btn-danger"
          style="width: 100%"
          href="reg.html"
          >申请账户</a
        >
        <hr class="hr20" />
        <a
          class="layui-btn layui-btn-lg layui-btn-danger"
          style="width: 100%"
          href="../../index.html"
          >返回首页</a
        >
        <hr class="hr20" />
      </form>
    </div>

    <script>
      // 使用 layui 的 form 模块
      layui.use(["form", "layer"], function () {
        console.log("layui loaded successfully!"); // 检查 layui 是否加载成功
        var form = layui.form;
        var layer = layui.layer;

        // 监听表单提交事件
        form.on("submit(login)", function (data) {
          console.log("Form submitted!"); // 检查事件是否触发
          // 阻止表单提交
          event.preventDefault();

          // 显示错误提示
          layer.msg("用户名或密码错误，请重新输入！", { icon: 2, time: 2000 });

          return false; // 阻止表单提交
        });
      });
    </script>
  </body>
</html>
